<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sync Monitor · 服务端</title>
<style>
  :root {
    --bg: #f6f8fc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --blue: #2563eb;
    --blue-soft: #eff6ff;
    --green: #059669;
    --red: #dc2626;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; cursor: pointer; border-radius: 8px; border: 1px solid transparent; padding: 7px 12px; font-size: 13px; transition: .15s; }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--blue); color: #fff; }
  .primary:hover { background: #1d4ed8; }
  .ghost { background: #fff; color: #334155; border-color: var(--line); }
  .ghost:hover { background: #f1f5f9; }
  .danger { color: var(--red); }
  .small { padding: 5px 9px; font-size: 12px; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 28px; background: linear-gradient(120deg, #0f172a, #1e293b 55%, #1d4ed8);
    color: #fff; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #38bdf8; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(56,189,248,.7); } 70% { box-shadow: 0 0 0 9px rgba(56,189,248,0); } 100% { box-shadow: 0 0 0 0 rgba(56,189,248,0); } }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: rgba(255,255,255,.62); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); }
  .chip.ok { background: rgba(16,185,129,.2); border-color: rgba(16,185,129,.4); }
  .chip.warn { background: rgba(245,158,11,.2); border-color: rgba(245,158,11,.4); }
  header .ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.2); }
  header .ghost:hover { background: rgba(255,255,255,.2); }

  main { max-width: 1240px; margin: 0 auto; padding: 22px 24px 40px; display: grid; grid-template-columns: 1.35fr .95fr; gap: 20px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .column { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; }
  .section-head h2 { font-size: 13px; letter-spacing: .6px; color: var(--muted); margin: 0; font-weight: 600; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .monitor-head { display: flex; align-items: flex-start; gap: 10px; }
  .monitor-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .monitor-head .url { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; word-break: break-all; }
  .spacer { flex: 1; }
  .badge { font-size: 11px; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 2px 8px; }
  .badge.gray { color: var(--muted); background: #f1f5f9; }
  .toggle { width: 38px; height: 22px; border-radius: 999px; background: #cbd5e1; border: 0; position: relative; padding: 0; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .18s; }
  .toggle.on { background: var(--blue); }
  .toggle.on::after { transform: translateX(16px); }

  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .meta .new { color: var(--blue); font-weight: 600; }
  .meta .error { color: var(--red); }
  .meta .ok { color: var(--green); }

  .items { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .item { background: #f8fafc; border-radius: 9px; padding: 8px 10px; font-size: 12.5px; line-height: 1.55; }
  .item .time { color: #94a3b8; font-size: 11px; margin-right: 6px; }
  .item a { color: #1e40af; }

  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .empty { text-align: center; color: var(--muted); padding: 32px 12px; font-size: 13px; }

  label.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  label.field > span { font-size: 12px; color: var(--muted); }
  input, select, textarea {
    font-family: inherit; font-size: 13px; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none;
    background: #fff; width: 100%; transition: .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  textarea { resize: vertical; min-height: 70px; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
  .row2 { display: flex; gap: 10px; }
  .row2 > label { flex: 1; }
  .hint { font-size: 11.5px; color: #94a3b8; line-height: 1.55; margin: 0 0 10px; }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  pre.logs { margin: 0; background: #0b1220; color: #cbd5e1; border-radius: 12px; padding: 14px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; max-width: 360px; }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>Sync Monitor · 服务端</h1>
      <p>定时采集主页动态 · SQLite 去重 · Server酱 推送到微信</p>
    </div>
  </div>
  <div class="chips">
    <span class="chip ok" id="chipStatus">服务运行中</span>
    <span class="chip" id="chipPush">Server酱</span>
    <button class="ghost small" id="testPush" type="button">测试推送</button>
  </div>
</header>

<main>
  <div class="column">
    <div class="section-head">
      <h2>监控项</h2>
      <button class="primary small" id="newMonitor" type="button">添加监控</button>
    </div>
    <div id="monitorList"></div>
  </div>

  <div class="column">
    <div class="card">
      <h3 style="margin:0 0 12px;font-size:15px" id="formTitle">添加监控项</h3>
      <label class="field"><span>名称</span><input id="fName" placeholder="同花顺 · 某用户主页" /></label>
      <label class="field"><span>主页地址</span><input id="fUrl" placeholder="https://..." spellcheck="false" /></label>
      <div class="row2">
        <label class="field">
          <span>类型</span>
          <select id="fType">
            <option value="browser">浏览器接口（单页应用）</option>
            <option value="rss">RSS / Atom</option>
            <option value="html">HTML 列表页</option>
            <option value="json">JSON 接口</option>
            <option value="auto">自动识别</option>
          </select>
        </label>
        <label class="field"><span>间隔（秒）</span><input id="fInterval" type="number" min="120" max="86400" step="60" value="300" /></label>
      </div>
      <p class="hint">同花顺主页属于 Vue 单页应用，需要选“浏览器接口”，并在下方填写接口配置。检查间隔建议 300–600 秒，避免触发风控。</p>
      <label class="field"><span>高级配置（JSON：browser / json / html / rss）</span><textarea id="fAdvanced" rows="10" spellcheck="false"></textarea></label>
      <div class="form-actions">
        <button class="primary" id="saveMonitor" type="button">保存并检查</button>
        <button class="ghost" id="thsPreset" type="button">同花顺模板</button>
        <button class="ghost" id="cancelEdit" type="button">取消</button>
      </div>
    </div>

    <div class="card">
      <div class="section-head" style="margin-bottom:10px">
        <h2>运行日志</h2>
        <button class="ghost small" id="refreshLogs" type="button">刷新</button>
      </div>
      <pre class="logs" id="logs"></pre>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let state = { monitors: [], serverchan: { configured: false }, logs: [] };
let editingId = null;

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  const text = await response.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}

function notify(message, isError) {
  const toast = $('toast');
  toast.textContent = message;
  toast.style.background = isError ? '#b91c1c' : '#0f172a';
  toast.classList.add('show');
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => toast.classList.remove('show'), 3200);
}

function ago(timestamp) {
  if (!timestamp) return '尚未检查';
  const diff = Date.now() - timestamp * 1000;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
  return `${Math.floor(diff / 86400000)} 天前`;
}

function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function typeLabel(type) {
  return { browser: '浏览器接口', rss: 'RSS', html: 'HTML', json: 'JSON', auto: '自动' }[type] || type;
}

function renderMonitors() {
  const container = $('monitorList');
  if (!state.monitors.length) {
    container.innerHTML = '<div class="card empty">还没有监控项，请在右侧添加。</div>';
    return;
  }
  container.innerHTML = state.monitors.map((monitor) => {
    const runtime = monitor.runtime || {};
    const items = (monitor.recent || []).slice(0, 3).map((item) => `
      <div class="item">
        ${item.time ? `<span class="time">${esc(item.time)}</span>` : ''}
        ${item.link ? `<a href="${esc(item.link)}" target="_blank" rel="noreferrer">${esc(item.content || item.title)}</a>` : esc(item.content || item.title)}
      </div>`).join('');
    return `
    <article class="card" style="margin-bottom:14px">
      <div class="monitor-head">
        <div>
          <h3>${esc(monitor.name)}</h3>
          <a class="url" href="${esc(monitor.url)}" target="_blank" rel="noreferrer">${esc(monitor.url)}</a>
        </div>
        <div class="spacer"></div>
        <span class="badge">${esc(typeLabel(monitor.type))}</span>
        <button class="toggle ${monitor.enabled ? 'on' : ''}" data-toggle="${esc(monitor.id)}" title="${monitor.enabled ? '暂停' : '启用'}"></button>
      </div>
      <div class="meta">
        <span>上次：${ago(runtime.last_check)}</span>
        <span>间隔：${Math.round(monitor.intervalSec / 60)} 分钟</span>
        <span>${runtime.initialized ? `<span class="ok">基线已建立</span>` : '<span>等待首次检查</span>'}</span>
        <span>本次 ${runtime.last_count || 0} 条</span>
        ${runtime.last_new_at ? `<span class="new">最近新增：${ago(runtime.last_new_at)}</span>` : ''}
        ${runtime.last_error ? `<span class="error">${esc(runtime.last_error)}</span>` : ''}
      </div>
      ${items ? `<div class="items">${items}</div>` : ''}
      <div class="actions">
        <button class="ghost small" data-check="${esc(monitor.id)}">立即检查</button>
        <button class="ghost small" data-edit="${esc(monitor.id)}">编辑</button>
        <button class="ghost small danger" data-delete="${esc(monitor.id)}">删除</button>
      </div>
    </article>`;
  }).join('');
}

function renderChips() {
  $('chipPush').textContent = state.serverchan.configured ? 'Server酱 已配置' : 'Server酱 未配置';
  $('chipPush').className = 'chip ' + (state.serverchan.configured ? 'ok' : 'warn');
  if (state.serverchan.configured && !state.serverchan.enabled) {
    $('chipPush').textContent = 'Server酱 已关闭';
    $('chipPush').className = 'chip warn';
  }
  $('logs').textContent = (state.logs || []).slice(-80).join('\n');
  $('logs').scrollTop = $('logs').scrollHeight;
}

async function refresh() {
  state = await api('/api/state');
  renderMonitors();
  renderChips();
}

function getMonitor(id) {
  return state.monitors.find((item) => item.id === id);
}

function fillForm(monitor) {
  editingId = monitor ? monitor.id : null;
  $('formTitle').textContent = monitor ? '编辑监控项' : '添加监控项';
  $('fName').value = monitor ? monitor.name : '';
  $('fUrl').value = monitor ? monitor.url : '';
  $('fType').value = monitor ? monitor.type : 'browser';
  $('fInterval').value = monitor ? monitor.intervalSec : 300;
  const advanced = monitor ? {
    browser: monitor.browser,
    json: monitor.json,
    html: monitor.html,
    rss: monitor.rss,
    headers: monitor.headers
  } : {
    browser: {
      pageUrl: '',
      waitMs: 2500,
      waitCookie: 'v',
      api: { url: '/user_center/open/api/content/v2/get_by_uid', method: 'POST', body: { user_code: '' } }
    },
    json: {
      listPath: 'data.contents', idPath: 'info.id', contentPath: 'abstract.content',
      timePath: 'info.ctime', timeFormat: 'ms', linkPath: 'info.jump_url'
    }
  };
  $('fAdvanced').value = JSON.stringify(advanced, null, 2);
}

function applyThsPreset() {
  const match = $('fUrl').value.match(/user_code=([\w]+)/);
  const code = match ? match[1] : '';
  if (!match) { notify('请先在主页地址里填入包含 user_code 的同花顺地址', true); return; }
  $('fType').value = 'browser';
  $('fInterval').value = 300;
  if (!$('fName').value.trim()) $('fName').value = '同花顺 · 主页动态';
  const pageUrl = `https://t.10jqka.com.cn/lgt/user_page/?user_code=${code}`;
  $('fUrl').value = pageUrl;
  $('fAdvanced').value = JSON.stringify({
    browser: {
      pageUrl,
      waitMs: 2500,
      waitCookie: 'v',
      api: {
        url: '/user_center/open/api/content/v2/get_by_uid',
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: { user_code: code }
      }
    },
    json: {
      listPath: 'data.contents',
      idPath: 'info.id',
      contentPath: 'abstract.content',
      timePath: 'info.ctime',
      timeFormat: 'ms',
      linkPath: 'info.jump_url'
    }
  }, null, 2);
  notify('已填入同花顺模板，保存即可开始监控');
}

$('newMonitor').addEventListener('click', () => { fillForm(null); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('cancelEdit').addEventListener('click', () => fillForm(null));
$('thsPreset').addEventListener('click', applyThsPreset);
$('refreshLogs').addEventListener('click', async () => {
  const data = await api('/api/logs');
  $('logs').textContent = data.logs.slice(-120).join('\n');
});

$('saveMonitor').addEventListener('click', async () => {
  const button = $('saveMonitor');
  button.disabled = true;
  try {
    const payload = {
      name: $('fName').value.trim(),
      url: $('fUrl').value.trim(),
      type: $('fType').value,
      intervalSec: Number($('fInterval').value) || 300,
      enabled: true
    };
    if (!payload.url) throw new Error('请填写主页地址');
    let advanced = {};
    try { advanced = JSON.parse($('fAdvanced').value || '{}'); } catch { throw new Error('高级配置不是合法 JSON'); }
    Object.assign(payload, advanced);
    if (editingId) await api(`/api/monitors/${encodeURIComponent(editingId)}`, { method: 'POST', body: JSON.stringify(payload) });
    else await api('/api/monitors', { method: 'POST', body: JSON.stringify(payload) });
    notify(editingId ? '已更新，正在检查…' : '已添加，正在建立基线…');
    fillForm(null);
    await refresh();
  } catch (error) {
    notify(error.message, true);
  } finally {
    button.disabled = false;
  }
});

$('testPush').addEventListener('click', async () => {
  try {
    const result = await api('/api/test-push', { method: 'POST', body: '{}' });
    notify(result.ok ? '测试消息已发送，请查看微信' : `发送失败：${result.message}`, !result.ok);
  } catch (error) {
    notify(error.message, true);
  }
});

$('monitorList').addEventListener('click', async (event) => {
  const target = event.target.closest('button');
  if (!target) return;
  const toggleId = target.dataset.toggle;
  const checkId = target.dataset.check;
  const editId = target.dataset.edit;
  const deleteId = target.dataset.delete;
  try {
    if (toggleId) {
      await api(`/api/monitors/${encodeURIComponent(toggleId)}/toggle`, { method: 'POST', body: '{}' });
      await refresh();
    } else if (checkId) {
      target.disabled = true;
      target.textContent = '检查中…';
      const result = await api(`/api/monitors/${encodeURIComponent(checkId)}/check`, { method: 'POST', body: '{}' });
      notify(result.ok ? (result.message || '检查完成') : `检查失败：${result.message}`, !result.ok);
      await refresh();
    } else if (editId) {
      fillForm(getMonitor(editId));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (deleteId) {
      const monitor = getMonitor(deleteId);
      if (!confirm(`确定删除“${monitor.name}”？已记录的历史条目也会一并删除。`)) return;
      await api(`/api/monitors/${encodeURIComponent(deleteId)}`, { method: 'DELETE' });
      notify('已删除');
      await refresh();
    }
  } catch (error) {
    notify(error.message, true);
    await refresh().catch(() => {});
  }
});

fillForm(null);
refresh().catch((error) => notify(`加载失败：${error.message}`, true));
setInterval(() => refresh().catch(() => {}), 15000);
</script>
</body>
</html>
