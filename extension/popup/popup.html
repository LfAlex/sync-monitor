<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sync Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="pulse"></span>
      <div>
        <h1>Sync Monitor</h1>
        <p id="subtitle">最近新动态</p>
      </div>
    </div>
    <button id="openSettings" class="ghost" type="button">设置</button>
  </header>

  <main>
    <div class="section-head">
      <div>
        <div class="section-title">
          <h2>最近新动态</h2>
          <span id="checkStatus" class="check-status">尚未检查</span>
        </div>
        <p id="unreadSummary" class="summary"></p>
      </div>
      <div class="section-actions">
        <button id="checkAll" class="ghost small" type="button">全部检查</button>
        <button id="markRead" class="ghost small" type="button">全部已读</button>
      </div>
    </div>

    <div id="feedback" class="feedback hidden" role="alert"></div>
    <div id="list" class="list"></div>
    <div id="emptyTip" class="empty hidden">
      <strong id="emptyTitle">暂无新动态</strong>
      <p id="emptyText">发现新内容后，会在这里显示最近几条。</p>
      <button id="emptyAction" class="primary small" type="button">管理监控</button>
    </div>
  </main>

  <footer class="footer">
    <button id="openAll" class="link-button" type="button">查看全部动态 →</button>
  </footer>

  <template id="itemTemplate">
    <article class="news-card" tabindex="0" role="button">
      <div class="news-meta"><span class="source"></span><span class="time"></span></div>
      <h3 class="news-title"></h3>
      <p class="news-content"></p>
      <div class="news-foot"><span class="ai-badge hidden">AI 概览</span><span class="read-more">阅读全文 →</span></div>
    </article>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
