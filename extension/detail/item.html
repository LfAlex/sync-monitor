<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动态内容 · Sync Monitor</title>
  <link rel="stylesheet" href="detail.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Sync Monitor</div>
    <div class="headline">
      <h1 id="monitorName">动态内容</h1>
      <a id="backLink" href="#" class="home-link">← 返回动态列表</a>
    </div>
    <div id="meta" class="meta"></div>
  </header>

  <main class="list">
    <article id="card" class="item item-full" hidden>
      <div class="item-head"><span id="time" class="time"></span></div>
      <section id="aiPanel" class="ai-summary">
        <div class="ai-head">
          <h2>AI 概览</h2>
          <div class="ai-actions">
            <button id="aiAction" class="ai-button" type="button">生成 AI 概览</button>
            <button id="aiSettings" class="ai-settings" type="button">AI 设置</button>
          </div>
        </div>
        <p id="aiText" class="ai-text">根据原文生成一段简明中文概览。</p>
        <p id="aiMeta" class="ai-meta"></p>
      </section>
      <p id="content" class="content"></p>
      <div id="images" class="images"></div>
      <div class="item-foot">
        <a id="origin" class="origin" target="_blank" rel="noreferrer">阅读原文 ↗</a>
      </div>
    </article>
    <div id="empty" class="empty" hidden></div>
  </main>

  <div id="imageViewer" class="image-viewer" hidden role="dialog" aria-modal="true" aria-label="查看动态配图">
    <button id="closeImageViewer" class="image-viewer-close" type="button" aria-label="关闭图片">×</button>
    <img id="imageViewerImg" alt="动态配图大图" referrerpolicy="no-referrer">
  </div>

  <script src="item.js" type="module"></script>
</body>
</html>
